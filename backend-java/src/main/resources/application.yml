server:
  port: ${PORT:5000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:hospital_management}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:hmsroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jdbc:
    template:
      fetch-size: 100
logging:
  level:
    root: INFO
    com.hospital: INFO
